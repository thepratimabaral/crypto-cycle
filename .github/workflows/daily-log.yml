name: Daily prediction log

on:
  schedule:
    - cron: "15 1 * * *"   # 01:15 UTC, after the daily candle has closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update prediction log
        id: log
        continue-on-error: true      # still commit the coins that worked
        run: python -m pipeline.live_log

      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/predictions_log.json data/raw/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "data: prediction log $(date -u +%F)"
          git pull --rebase
          git push

      - name: Fail if a coin was skipped or stale
        if: steps.log.outcome == 'failure'
        run: |
          echo "::error::At least one coin could not be fetched or had stale data. See 'Update prediction log'."
          exit 1
